name: Build & Release Signed Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build, Sign & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing required GitHub Repository Secrets! Configure KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Decode persistent signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "${{ github.workspace }}/app/release-keystore.p12"
          keytool -list -keystore "${{ github.workspace }}/app/release-keystore.p12" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          echo "Keystore decoded and verified for alias: $KEY_ALIAS"

      - name: Setup Gradle & Dependency Cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Compile & Sign Release APK (Cloud Build)
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_PATH: ${{ github.workspace }}/app/release-keystore.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK Alignment, Signature & Package Release Asset
        id: verify_apk
        run: |
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "::error::Expected signed APK not found at $APK_SOURCE"
            exit 1
          fi

          BUILD_TOOLS_DIR=$(ls -d "${ANDROID_HOME}/build-tools/"* | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"

          "$BUILD_TOOLS_DIR/zipalign" -c -v 4 "$APK_SOURCE"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK_SOURCE"

          mkdir -p release-output
          OUT_NAME="VishalNursery-Cashmemo-v1.0.${{ github.run_number }}.apk"
          cp "$APK_SOURCE" "release-output/$OUT_NAME"

          SHA256=$(sha256sum "release-output/$OUT_NAME" | awk '{print $1}')
          SIZE_MB=$(du -m "release-output/$OUT_NAME" | awk '{print $1}')
          echo "apk_path=release-output/$OUT_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "apk_size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"

      - name: Clean up decoded keystore
        if: always()
        run: rm -f "${{ github.workspace }}/app/release-keystore.p12"

      - name: Publish Signed APK to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Vishal Nursery Cashmemo v1.0.${{ github.run_number }}
          files: ${{ steps.verify_apk.outputs.apk_path }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
          body: |
            ## Vishal Nursery Cashmemo (`v1.0.${{ github.run_number }}`)

            - **Application ID:** `com.vishalnursery.cashmemo`
            - **Version Code:** `${{ github.run_number }}` (auto-incremented for seamless in-place updates)
            - **Signing:** Signed with persistent release keystore (`KEYSTORE_BASE64`) & 4-byte aligned
            - **APK Size:** ~${{ steps.verify_apk.outputs.apk_size_mb }} MB
            - **SHA-256:** `${{ steps.verify_apk.outputs.apk_sha256 }}`

            Download the `.apk` asset below and tap to install directly over any previous release without uninstalling.
